<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Canvas (v1)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; color: #e8ecff; font-family: Inter, system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(6, 10, 20, 0.78); border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px; padding: 10px 12px; min-width: 280px; backdrop-filter: blur(6px);
      }
      #hud h3 { margin: 0 0 8px 0; font-size: 14px; }
      #hud label { display: block; font-size: 12px; margin-top: 8px; opacity: .9; }
      #hud input { width: 100%; }
      #hud .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #hud small { opacity: 0.75; display:block; margin-top: 8px; line-height: 1.35; }
      #legend { margin-top: 8px; font-size: 12px; opacity: .9; }
      #legend div { margin-top: 3px; }

      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      .planet-label {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 11px;
        color: #dfe7ff;
        background: rgba(9, 14, 28, 0.72);
        border: 1px solid rgba(255,255,255,0.18);
        padding: 2px 6px;
        border-radius: 999px;
        white-space: nowrap;
        pointer-events: auto;
        cursor: pointer;
      }
      .planet-label.hovered {
        border-color: rgba(255,255,255,0.85);
        background: rgba(20, 30, 54, 0.9);
      }
      #planetPopup {
        position: absolute;
        transform: translate(-50%, -120%);
        min-width: 180px;
        max-width: 260px;
        background: rgba(7, 11, 24, 0.9);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 10px;
        padding: 8px;
        font-size: 12px;
        color: #e9eeff;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="hud">
      <h3>Solar System v1 (all planets)</h3>
      <label>Orbit speed <span id="speedVal">1.00x</span></label>
      <input id="speed" type="range" min="0" max="4" step="0.01" value="1" />

      <label>Distance compression <span id="distVal">0.30</span></label>
      <input id="dist" type="range" min="0.2" max="1" step="0.01" value="0.30" />

      <label>Planet visibility boost <span id="sizeBoostVal">2.0x</span></label>
      <input id="sizeBoost" type="range" min="1" max="6" step="0.1" value="2" />

      <label>Sun display scale <span id="sunScaleVal">0.12x</span></label>
      <input id="sunScale" type="range" min="0.05" max="0.5" step="0.01" value="0.12" />

      <div class="row" style="margin-top:8px;">
        <label style="margin:0;">Show orbit paths</label>
        <input id="orbits" type="checkbox" checked style="width:auto;" />
      </div>

      <div id="legend">
        <div><strong>Size ratios:</strong> accurate (Earth=1 baseline)</div>
        <div><strong>Distances:</strong> compressed for visibility</div>
      </div>
      <small>Drag to rotate · scroll to zoom · right-drag to pan</small>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';

      const container = document.getElementById('app');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070d);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 12000);
      camera.position.set(0, 220, 520);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.minDistance = 60;
      controls.maxDistance = 8000;

      scene.add(new THREE.AmbientLight(0x6677aa, 0.36));
      const sunLight = new THREE.PointLight(0xffddaa, 2.0, 0, 2);
      scene.add(sunLight);

      // Stars
      const starGeo = new THREE.BufferGeometry();
      const starCount = 6000;
      const positions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const r = 5000;
        positions[i * 3 + 0] = (Math.random() - 0.5) * r * 2;
        positions[i * 3 + 1] = (Math.random() - 0.5) * r * 2;
        positions[i * 3 + 2] = (Math.random() - 0.5) * r * 2;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.1 })));

      // Real size ratios relative to Earth radius = 1
      // Distances are in AU from Sun and compressed for usability.
      const EARTH_RENDER_RADIUS = 1.5;
      const SIZE_SCALE = EARTH_RENDER_RADIUS;
      const AU_BASE = 220; // visual AU baseline before compression

      let distanceCompression = 0.30;
      function scaledOrbit(au) {
        return au * AU_BASE * distanceCompression;
      }

      const sunRadiusEarth = 109.1;
      let sunDisplayScale = 0.12; // visual compromise so inner planets remain visible
      const sun = new THREE.Mesh(
        new THREE.SphereGeometry(sunRadiusEarth * SIZE_SCALE * sunDisplayScale, 64, 64),
        new THREE.MeshStandardMaterial({ emissive: 0xffb347, emissiveIntensity: 1.15, color: 0x5e3200 })
      );
      scene.add(sun);

      let sizeBoost = 2.0;

      const TEX = {
        mercury: '/textures/mercury.jpg',
        venus: '/textures/venus.jpg',
        earth: '/textures/earth.jpg',
        mars: '/textures/mars.jpg',
        jupiter: '/textures/jupiter.jpg',
        saturn: '/textures/saturn.jpg',
        uranus: '/textures/uranus.jpg',
        neptune: '/textures/neptune.jpg'
      };
      const textureLoader = new THREE.TextureLoader();

      const planetData = [
        { name: 'Mercury', radiusEarth: 0.383, au: 0.39, periodYears: 0.24, color: 0x8c8c8c, texture: TEX.mercury },
        { name: 'Venus',   radiusEarth: 0.949, au: 0.72, periodYears: 0.62, color: 0xc7a46d, texture: TEX.venus },
        { name: 'Earth',   radiusEarth: 1.000, au: 1.00, periodYears: 1.00, color: 0x4b78ff, texture: TEX.earth },
        { name: 'Mars',    radiusEarth: 0.532, au: 1.52, periodYears: 1.88, color: 0xc86b4f, texture: TEX.mars },
        { name: 'Jupiter', radiusEarth: 11.21, au: 5.20, periodYears: 11.86, color: 0xd7b38c, texture: TEX.jupiter },
        { name: 'Saturn',  radiusEarth: 9.45,  au: 9.58, periodYears: 29.46, color: 0xd8c28f, texture: TEX.saturn },
        { name: 'Uranus',  radiusEarth: 4.01,  au: 19.2, periodYears: 84.01, color: 0x88d3dd, texture: TEX.uranus },
        { name: 'Neptune', radiusEarth: 3.88,  au: 30.05, periodYears: 164.8, color: 0x4a7df6, texture: TEX.neptune }
      ];

      const planets = [];

      function createOrbitPath(radius) {
        return new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(
            Array.from({ length: 256 }, (_, i) => {
              const a = (i / 256) * Math.PI * 2;
              return new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius);
            })
          ),
          new THREE.LineBasicMaterial({ color: 0x31486f, transparent: true, opacity: 0.75 })
        );
      }

      function computeRadius(p) {
        return Math.max(0.45, p.radiusEarth * SIZE_SCALE * sizeBoost);
      }

      function addPlanet(p) {
        const group = new THREE.Group();
        scene.add(group);

        const radius = computeRadius(p);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0.02 });
        if (p.texture) {
          textureLoader.load(
            p.texture,
            (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              mat.map = tex;
              mat.needsUpdate = true;
            },
            undefined,
            () => {
              // fallback to solid color if texture fetch fails
              mat.color.setHex(p.color);
              mat.needsUpdate = true;
            }
          );
        }

        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 36, 36),
          mat
        );
        const orbitRadius = scaledOrbit(p.au);
        mesh.position.set(orbitRadius, 0, 0);
        group.add(mesh);

        const orbitPath = createOrbitPath(orbitRadius);
        scene.add(orbitPath);

        // Relative orbital angular speed (faster for shorter periods)
        const orbitSpeed = 1 / p.periodYears;

        return { ...p, group, mesh, orbitPath, orbitRadius, orbitSpeed, radius };
      }

      for (const p of planetData) planets.push(addPlanet(p));
      for (const p of planets) p.mesh.userData.planet = p;
      sun.userData.planet = {
        name: 'Sun',
        radiusEarth: sunRadiusEarth,
        au: 0,
        periodYears: 0,
        mesh: sun,
        radius: sunRadiusEarth * SIZE_SCALE * sunDisplayScale,
      };

      const overlay = document.getElementById('overlay');
      const labelEls = new Map();
      for (const p of planets) {
        const el = document.createElement('div');
        el.className = 'planet-label';
        el.textContent = p.name;
        el.dataset.planetName = p.name;

        el.addEventListener('mouseenter', () => {
          el.classList.add('hovered');
          setHover(p.mesh);
        });
        el.addEventListener('mouseleave', () => {
          el.classList.remove('hovered');
          setHover(null);
        });
        el.addEventListener('click', () => {
          selectedPlanet = p;
          popupEl.innerHTML = `
            <strong>${p.name}</strong><br/>
            Radius: ${p.radiusEarth.toFixed(3)} Earths<br/>
            Orbit: ${p.au.toFixed(2)} AU<br/>
            Year length: ${p.periodYears.toFixed(2)} Earth years
          `;
          popupEl.style.display = 'block';
          setHover(p.mesh);
        });

        overlay.appendChild(el);
        labelEls.set(p.name, el);
      }

      const popupEl = document.createElement('div');
      popupEl.id = 'planetPopup';
      overlay.appendChild(popupEl);

      let selectedPlanet = null;
      let hoveredObject = null;

      function setHover(obj) {
        if (hoveredObject === obj) return;

        if (hoveredObject?.material) {
          hoveredObject.material.emissiveIntensity = hoveredObject.userData.baseEmissiveIntensity ?? 0.08;
        }

        hoveredObject = obj || null;

        if (hoveredObject?.material) {
          if (hoveredObject.userData.baseEmissiveIntensity == null) {
            hoveredObject.userData.baseEmissiveIntensity = hoveredObject.material.emissiveIntensity ?? 0;
          }
          hoveredObject.material.emissive = new THREE.Color(0xffffff);
          hoveredObject.material.emissiveIntensity = 0.38;
        }
      }

      // Hover/selection is now controlled from nameplates.
      renderer.domElement.addEventListener('click', () => {
        selectedPlanet = null;
        popupEl.style.display = 'none';
        setHover(null);
        for (const el of labelEls.values()) el.classList.remove('hovered');
      });

      // Saturn rings
      const saturn = planets.find(p => p.name === 'Saturn');
      if (saturn) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(saturn.radius * 1.4, saturn.radius * 2.2, 64),
          new THREE.MeshBasicMaterial({ color: 0xbca36d, side: THREE.DoubleSide, transparent: true, opacity: 0.75 })
        );
        ring.rotation.x = -Math.PI / 2.4;
        saturn.mesh.add(ring);
      }

      // UI
      const speedInput = document.getElementById('speed');
      const speedVal = document.getElementById('speedVal');
      const distInput = document.getElementById('dist');
      const distVal = document.getElementById('distVal');
      const sizeBoostInput = document.getElementById('sizeBoost');
      const sizeBoostVal = document.getElementById('sizeBoostVal');
      const sunScaleInput = document.getElementById('sunScale');
      const sunScaleVal = document.getElementById('sunScaleVal');
      const orbitToggle = document.getElementById('orbits');

      let speedMul = 1;
      speedInput.addEventListener('input', (e) => {
        speedMul = Number(e.target.value);
        speedVal.textContent = `${speedMul.toFixed(2)}x`;
      });

      function rebuildPlanetVisuals() {
        for (const p of planets) {
          p.orbitRadius = scaledOrbit(p.au);
          p.mesh.position.set(p.orbitRadius, 0, 0);

          const newRadius = computeRadius(p);
          p.radius = newRadius;
          p.mesh.geometry.dispose();
          p.mesh.geometry = new THREE.SphereGeometry(newRadius, 36, 36);

          scene.remove(p.orbitPath);
          p.orbitPath.geometry.dispose();
          p.orbitPath.material.dispose();
          p.orbitPath = createOrbitPath(p.orbitRadius);
          p.orbitPath.visible = orbitToggle.checked;
          scene.add(p.orbitPath);
        }

        const sat = planets.find(p => p.name === 'Saturn');
        if (sat) {
          const oldRing = sat.mesh.children.find(c => c.type === 'Mesh');
          if (oldRing) sat.mesh.remove(oldRing);
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(sat.radius * 1.4, sat.radius * 2.2, 64),
            new THREE.MeshBasicMaterial({ color: 0xbca36d, side: THREE.DoubleSide, transparent: true, opacity: 0.75 })
          );
          ring.rotation.x = -Math.PI / 2.4;
          sat.mesh.add(ring);
        }
      }

      distInput.addEventListener('input', (e) => {
        distanceCompression = Number(e.target.value);
        distVal.textContent = distanceCompression.toFixed(2);
        rebuildPlanetVisuals();
      });

      sizeBoostInput.addEventListener('input', (e) => {
        sizeBoost = Number(e.target.value);
        sizeBoostVal.textContent = `${sizeBoost.toFixed(1)}x`;
        rebuildPlanetVisuals();
      });

      sunScaleInput.addEventListener('input', (e) => {
        sunDisplayScale = Number(e.target.value);
        sunScaleVal.textContent = `${sunDisplayScale.toFixed(2)}x`;
        sun.geometry.dispose();
        sun.geometry = new THREE.SphereGeometry(sunRadiusEarth * SIZE_SCALE * sunDisplayScale, 64, 64);
      });

      orbitToggle.addEventListener('change', (e) => {
        const visible = e.target.checked;
        for (const p of planets) p.orbitPath.visible = visible;
      });

      const clock = new THREE.Clock();
      function animate() {
        const t = clock.getElapsedTime() * speedMul * 0.25;

        sun.rotation.y += 0.0018;

        for (const p of planets) {
          p.group.rotation.y = t * p.orbitSpeed;
          p.mesh.rotation.y += Math.min(0.02, 0.005 + 0.01 / Math.max(1, p.radiusEarth));

          const worldPos = new THREE.Vector3();
          p.mesh.getWorldPosition(worldPos);

          // Place label above planet in world space (Y-up axis), then project to screen.
          const labelWorldPos = worldPos.clone().add(new THREE.Vector3(0, Math.max(1.2, p.radius * 1.6), 0));
          const projected = labelWorldPos.clone().project(camera);
          const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
          const visible = projected.z < 1;

          const lbl = labelEls.get(p.name);
          if (lbl) {
            lbl.style.display = visible ? 'block' : 'none';
            lbl.style.left = `${x}px`;
            lbl.style.top = `${y}px`;
          }

          if (selectedPlanet && selectedPlanet.name === p.name) {
            popupEl.style.display = visible ? 'block' : 'none';
            popupEl.style.left = `${x}px`;
            popupEl.style.top = `${y - 26}px`;
          }
        }

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
