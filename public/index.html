<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galactic Trail v0</title>
    <style>
      html, body { margin:0; height:100%; background:#04060e; color:#eaf0ff; font-family: Inter, system-ui, sans-serif; }
      #app { display:grid; grid-template-columns: 1fr 340px; height:100%; }
      #scene { position:relative; overflow:hidden; background: radial-gradient(circle at 30% 20%, #1a2452 0%, #070b1b 45%, #03050d 100%); }
      #hud { border-left:1px solid rgba(255,255,255,.12); padding:12px; background:rgba(8,12,24,.85); overflow:auto; }
      h2,h3 { margin:6px 0; }
      .stats { display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:13px; }
      .card { border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:8px; background:rgba(14,20,36,.7); }
      .bar { height:8px; border-radius:999px; background:#1a2238; overflow:hidden; margin-top:4px; }
      .fill { height:100%; }
      .btns { display:grid; gap:8px; margin-top:10px; }
      button { border:1px solid rgba(255,255,255,.2); background:#111a34; color:#eaf0ff; border-radius:8px; padding:8px 10px; cursor:pointer; }
      button:hover { background:#172246; }
      #log { font-size:12px; line-height:1.35; max-height:260px; overflow:auto; white-space:pre-wrap; }
      .node { position:absolute; width:12px; height:12px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 10px currentColor; }
      .node.current { width:16px; height:16px; border:2px solid #fff; }
      .path { position:absolute; height:2px; background:rgba(133,173,255,.5); transform-origin:left center; }
      .label { position:absolute; transform:translate(-50%, -130%); font-size:11px; opacity:.85; pointer-events:none; }
      #banner { margin:8px 0; font-size:13px; color:#9bc2ff; }
      @media (max-width: 900px) { #app { grid-template-columns: 1fr; } #hud { border-left:none; border-top:1px solid rgba(255,255,255,.12);} }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>
      <div id="hud">
        <h2>Galactic Trail v0</h2>
        <div id="banner">Navigate cosmic epochs. Survive. Learn.</div>

        <div class="card" style="margin-bottom:8px;">
          <strong>Epoch</strong>
          <div id="epochText">—</div>
          <div style="font-size:12px;opacity:.8;" id="epochSub">—</div>
        </div>

        <div class="stats">
          <div class="card">Fuel<div class="bar"><div id="fuelBar" class="fill" style="background:#6fb5ff"></div></div><div id="fuelVal"></div></div>
          <div class="card">Integrity<div class="bar"><div id="intBar" class="fill" style="background:#72e39e"></div></div><div id="intVal"></div></div>
          <div class="card">Morale<div class="bar"><div id="morBar" class="fill" style="background:#ffd166"></div></div><div id="morVal"></div></div>
          <div class="card">Data<div class="bar"><div id="datBar" class="fill" style="background:#c792ff"></div></div><div id="datVal"></div></div>
        </div>

        <div class="btns">
          <button id="jumpBtn">Jump to next galaxy node</button>
          <button id="scanBtn">Scan local region (+data, -fuel)</button>
          <button id="repairBtn">Repair hull (+integrity, -fuel, -morale)</button>
          <button id="resetBtn">Reset run</button>
        </div>

        <h3>Mission Log</h3>
        <div id="log" class="card"></div>
      </div>
    </div>

    <script>
      const epochs = [
        { name: 'Cosmic Dawn', z: 'z~20', blurb: 'First stars ignite. Heavy elements are rare.' },
        { name: 'Galaxy Assembly', z: 'z~6', blurb: 'Protogalaxies merge into larger structures.' },
        { name: 'Peak Star Formation', z: 'z~2', blurb: 'The universe is bright and violently creative.' },
        { name: 'Modern Universe', z: 'z~0', blurb: 'Mature galaxies, rich chemistry, complex systems.' },
        { name: 'Far Future (Speculative)', z: 'z<0', blurb: 'Starbirth fades; long-term survival dominates.' },
      ];

      let state;
      const scene = document.getElementById('scene');
      const logEl = document.getElementById('log');

      function rand(min, max){ return Math.random() * (max-min)+min; }
      function rint(min, max){ return Math.floor(rand(min, max+1)); }
      function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

      function makeNodes(){
        const w = scene.clientWidth || window.innerWidth;
        const h = scene.clientHeight || window.innerHeight;
        const nodes = [];
        for(let i=0;i<epochs.length;i++){
          nodes.push({
            x: (w * 0.12) + (i * (w * 0.18)) + rand(-30,30),
            y: h*0.25 + rand(-60,60),
            epoch:i,
            name: `Node ${i+1}`,
          });
        }
        return nodes;
      }

      function log(msg){
        const ts = new Date().toLocaleTimeString();
        logEl.textContent = `[${ts}] ${msg}\n` + logEl.textContent;
      }

      function renderScene(){
        scene.innerHTML = '';

        // stars
        for(let i=0;i<220;i++){
          const s = document.createElement('div');
          s.style.position='absolute';
          s.style.left = `${Math.random()*100}%`;
          s.style.top = `${Math.random()*100}%`;
          const sz = Math.random()<0.9 ? 1 : 2;
          s.style.width = `${sz}px`; s.style.height=`${sz}px`;
          s.style.borderRadius='50%'; s.style.background='rgba(255,255,255,.85)';
          scene.appendChild(s);
        }

        // paths
        for(let i=0;i<state.nodes.length-1;i++){
          const a=state.nodes[i], b=state.nodes[i+1];
          const dx=b.x-a.x, dy=b.y-a.y;
          const len=Math.hypot(dx,dy);
          const ang=Math.atan2(dy,dx)*180/Math.PI;
          const p=document.createElement('div');
          p.className='path';
          p.style.left=`${a.x}px`; p.style.top=`${a.y}px`;
          p.style.width=`${len}px`; p.style.transform=`rotate(${ang}deg)`;
          scene.appendChild(p);
        }

        state.nodes.forEach((n, idx)=>{
          const node=document.createElement('div');
          node.className='node' + (idx===state.pos ? ' current' : '');
          node.style.left=`${n.x}px`; node.style.top=`${n.y}px`;
          node.style.color = idx < state.pos ? '#72e39e' : '#7da6ff';
          node.style.background = idx===state.pos ? '#9dc2ff' : '#6c89d4';
          scene.appendChild(node);

          const lbl=document.createElement('div');
          lbl.className='label';
          lbl.style.left=`${n.x}px`; lbl.style.top=`${n.y}px`;
          lbl.textContent = epochs[n.epoch].name;
          scene.appendChild(lbl);
        });
      }

      function updateHUD(){
        const epoch = epochs[state.pos];
        document.getElementById('epochText').textContent = `${epoch.name} (${epoch.z})`;
        document.getElementById('epochSub').textContent = epoch.blurb;

        const bars = [
          ['fuel', '#fuelBar', '#fuelVal'],
          ['integrity', '#intBar', '#intVal'],
          ['morale', '#morBar', '#morVal'],
          ['data', '#datBar', '#datVal'],
        ];
        bars.forEach(([k,b,v])=>{
          const val = Math.round(state[k]);
          document.querySelector(b).style.width = `${val}%`;
          document.querySelector(v).textContent = `${val}/100`;
        });

        const dead = state.fuel<=0 || state.integrity<=0 || state.morale<=0;
        document.getElementById('jumpBtn').disabled = dead || state.pos>=epochs.length-1;
        document.getElementById('scanBtn').disabled = dead;
        document.getElementById('repairBtn').disabled = dead;

        if(dead) log('Mission failed: your expedition collapsed. Reset to try again.');
        if(state.pos>=epochs.length-1 && !state.won){
          state.won=true;
          log(`Mission complete. You crossed cosmic history with ${Math.round(state.data)} data integrity.`);
        }
      }

      function cosmicEvent(){
        const roll = Math.random();
        if(roll < 0.22){
          const d=rint(6,16); state.integrity-=d; log(`Encounter: micrometeoroid swarm. Integrity -${d}.`);
        } else if(roll < 0.44){
          const d=rint(5,14); state.morale-=d; log(`Encounter: prolonged dark transit. Morale -${d}.`);
        } else if(roll < 0.66){
          const d=rint(8,18); state.data+=d; log(`Discovery: gravitational lensing anomaly. Data +${d}.`);
        } else if(roll < 0.84){
          const d=rint(6,14); state.fuel+=d; log(`Lucky break: recoverable propellant depot. Fuel +${d}.`);
        } else {
          const d=rint(6,16); state.fuel-=d; log(`Hazard: evasive burn against debris field. Fuel -${d}.`);
        }
        state.fuel=clamp(state.fuel,0,100);
        state.integrity=clamp(state.integrity,0,100);
        state.morale=clamp(state.morale,0,100);
        state.data=clamp(state.data,0,100);
      }

      function jump(){
        if(state.pos>=epochs.length-1) return;
        const cost=rint(8,15);
        state.fuel-=cost;
        state.pos+=1;
        log(`Jump executed to ${epochs[state.pos].name}. Fuel -${cost}.`);
        cosmicEvent();
        renderScene();
        updateHUD();
      }

      function scan(){
        const fuel=rint(4,9), gain=rint(7,15);
        state.fuel-=fuel; state.data+=gain;
        log(`Deep scan complete. Data +${gain}, Fuel -${fuel}.`);
        if(Math.random()<0.35){ const m=rint(3,8); state.morale+=m; log(`Crew inspired by findings. Morale +${m}.`); }
        state.fuel=clamp(state.fuel,0,100); state.data=clamp(state.data,0,100); state.morale=clamp(state.morale,0,100);
        updateHUD();
      }

      function repair(){
        const fuel=rint(6,12), heal=rint(8,18), morale=rint(3,8);
        state.fuel-=fuel; state.integrity+=heal; state.morale-=morale;
        log(`Repairs complete. Integrity +${heal}, Fuel -${fuel}, Morale -${morale}.`);
        state.fuel=clamp(state.fuel,0,100); state.integrity=clamp(state.integrity,0,100); state.morale=clamp(state.morale,0,100);
        updateHUD();
      }

      function reset(){
        state={ fuel:84, integrity:82, morale:78, data:20, pos:0, nodes:makeNodes(), won:false };
        logEl.textContent='';
        log('New run initialized. Welcome, captain.');
        renderScene();
        updateHUD();
      }

      document.getElementById('jumpBtn').onclick=jump;
      document.getElementById('scanBtn').onclick=scan;
      document.getElementById('repairBtn').onclick=repair;
      document.getElementById('resetBtn').onclick=reset;
      window.addEventListener('resize', ()=>{ state.nodes=makeNodes(); renderScene(); });

      reset();
    </script>
  </body>
</html>
