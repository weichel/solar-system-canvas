<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System Canvas (v1.12)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; color: #e8ecff; font-family: Inter, system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(6, 10, 20, 0.78); border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px; padding: 10px 12px; min-width: 140px; max-width: 180px; backdrop-filter: blur(6px);
      }
      #hud h3 { margin: 0 0 8px 0; font-size: 14px; }
      #hud label { display: block; font-size: 12px; margin-top: 8px; opacity: .9; }
      #hud input { width: 100%; }
      #hud .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #hud small { opacity: 0.75; display:block; margin-top: 8px; line-height: 1.35; }
      #legend { margin-top: 8px; font-size: 12px; opacity: .9; }
      #legend div { margin-top: 3px; }

      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      .planet-label {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 11px;
        color: #dfe7ff;
        background: rgba(9, 14, 28, 0.72);
        border: 1px solid rgba(255,255,255,0.18);
        padding: 2px 6px;
        border-radius: 999px;
        white-space: nowrap;
        pointer-events: auto;
        cursor: pointer;
      }
      .planet-label.hovered {
        border-color: rgba(255,255,255,0.85);
        background: rgba(20, 30, 54, 0.9);
      }
      #planetPopup {
        position: absolute;
        transform: translate(-50%, -120%);
        min-width: 180px;
        max-width: 260px;
        background: rgba(7, 11, 24, 0.9);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 10px;
        padding: 8px;
        font-size: 12px;
        color: #e9eeff;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="hud">
      <h3>Solar System v1.12 (major bodies)</h3>
      <label>Orbit speed <span id="speedVal">1.00x</span></label>
      <input id="speed" type="range" min="0" max="4" step="0.01" value="1" />


      <label>Planet visibility boost <span id="sizeBoostVal">1.0x</span></label>
      <input id="sizeBoost" type="range" min="1" max="6" step="0.1" value="1" />

      <label>Sun display scale <span id="sunScaleVal">1.00x</span></label>
      <input id="sunScale" type="range" min="0.05" max="1" step="0.01" value="1" />
      <div class="row" style="margin-top:6px;">
        <label style="margin:0;">True Sun scale</label>
        <input id="sunTrueScale" type="checkbox" checked style="width:auto;" />
      </div>

      <div class="row" style="margin-top:8px;">
        <label style="margin:0;">Show orbit paths</label>
        <input id="orbits" type="checkbox" checked style="width:auto;" />
      </div>
      <div class="row" style="margin-top:6px;">
        <label style="margin:0;">Show asteroid belt</label>
        <input id="asteroids" type="checkbox" checked style="width:auto;" />
      </div>
      <div class="row" style="margin-top:6px;">
        <label style="margin:0;">Show moons</label>
        <input id="moons" type="checkbox" checked style="width:auto;" />
      </div>
      <div class="row" style="margin-top:6px;">
        <label style="margin:0;">Show secondary moons</label>
        <input id="secondaryMoons" type="checkbox" checked style="width:auto;" />
      </div>
      <div class="row" style="margin-top:6px;">
        <label style="margin:0;">Show satellites</label>
        <input id="satellites" type="checkbox" style="width:auto;" />
      </div>

      <div id="legend">
        <div><strong>Size ratios:</strong> accurate (Earth=1 baseline)</div>
        <div><strong>Distances:</strong> compressed for visibility</div>
      </div>

      <label>Render quality</label>
      <select id="quality" style="width:100%; margin-top:4px;">
        <option value="auto" selected>Auto</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="ultra">Ultra</option>
      </select>

      <label>Units</label>
      <select id="units" style="width:100%; margin-top:4px;">
        <option value="astronomy" selected>Astronomy (AU + Earth radii)</option>
        <option value="metric">Metric (km)</option>
      </select>

      <div class="row" style="margin-top:8px; gap:6px;">
        <button id="focusBtn" style="flex:1;">Focus selected</button>
        <button id="homeBtn" style="flex:1;">Home camera</button>
      </div>
      <div class="row" style="margin-top:6px;">
        <label style="margin:0;">Cinematic mode</label>
        <input id="cinematic" type="checkbox" style="width:auto;" />
      </div>

      <div id="details" style="margin-top:8px; font-size:12px; border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:8px; background:rgba(10,14,28,.7);">
        <strong>Selection</strong><br/>Click a planet label to inspect details.
      </div>

      <small>Left-click to focus · right-drag to rotate · scroll to zoom · WASD move (clears focus)</small>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import * as sat from 'https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/+esm';
      import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
      import { EffectComposer } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/EffectComposer.js';
      import { RenderPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/UnrealBloomPass.js';
      import { FilmPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/FilmPass.js';

      const container = document.getElementById('app');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070d);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300000);
      camera.position.set(0, 220, 520);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.physicallyCorrectLights = false;
      container.appendChild(renderer.domElement);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.62, 0.85, 0.14);
      composer.addPass(bloomPass);
      const filmPass = new FilmPass(0.16, 0.0, 0, false);
      composer.addPass(filmPass);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.minDistance = 0.5;
      controls.maxDistance = 150000;
      controls.mouseButtons.LEFT = -1; // left-click reserved for focus interaction
      controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;

      const HOME_CAMERA_POS = new THREE.Vector3(0, 220, 520);
      const HOME_TARGET = new THREE.Vector3(0, 0, 0);
      controls.target.copy(HOME_TARGET);

      // Lighting tuned for clearer day/night contrast from the Sun direction.
      scene.add(new THREE.AmbientLight(0x4d5f80, 0.24));
      // Main sunlight: no distance falloff at this simulation scale.
      const sunLight = new THREE.PointLight(0xfff1cf, 1.35, 0, 0);
      sunLight.position.set(0, 0, 0);
      scene.add(sunLight);

      // Very subtle fill so the night side is not fully crushed.
      scene.add(new THREE.HemisphereLight(0x1f2f52, 0x05060a, 0.06));

      // Stars (in a distant shell so they don't appear inside the planetary region)
      const starGeo = new THREE.BufferGeometry();
      const starCount = 6000;
      const positions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const minR = 2200;
        const maxR = 5200;
        const r = minR + Math.random() * (maxR - minR);
        const u = Math.random() * 2 - 1;
        const phi = Math.random() * Math.PI * 2;
        const s = Math.sqrt(1 - u * u);
        positions[i * 3 + 0] = r * s * Math.cos(phi);
        positions[i * 3 + 1] = r * u;
        positions[i * 3 + 2] = r * s * Math.sin(phi);
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, transparent: true, opacity: 1.0 });
      const stars = new THREE.Points(starGeo, starMaterial);
      // Inner star particles disabled by request.
      stars.visible = false;

      // Real size ratios relative to Earth radius = 1
      // Distances are in AU from Sun and compressed for usability.
      const EARTH_RENDER_RADIUS = 1.5;
      const SIZE_SCALE = EARTH_RENDER_RADIUS;
      const AU_BASE = 220; // visual AU baseline before compression

      let distanceCompression = 1.00;
      function scaledOrbit(au) {
        return au * AU_BASE * distanceCompression;
      }

      function getSunRenderRadius() {
        return sunRadiusEarth * SIZE_SCALE * sunDisplayScale;
      }

      function computeOrbitLayout(planetsArr) {
        // Keep true relative order, but enforce non-overlap for elliptical orbits (Sun at focus).
        // For each planet: perihelion = a(1-e), aphelion = a(1+e).
        let prevOuterEdge = getSunRenderRadius() + 8;
        for (const p of planetsArr) {
          const e = Math.min(0.95, Math.max(0, p.eccentricity || 0));
          const rawA = scaledOrbit(p.au);

          // Ensure perihelion does not intersect Sun/inner-neighbor region.
          const minPeriCenter = prevOuterEdge + p.radius + 6;
          const minA = minPeriCenter / Math.max(0.05, (1 - e));

          p.orbitRadius = Math.max(rawA, minA);

          const aphelionCenter = p.orbitRadius * (1 + e);
          prevOuterEdge = aphelionCenter + p.radius;
        }
      }

      const sunRadiusEarth = 109.1;
      let sunDisplayScale = 1.0;
      const sun = new THREE.Mesh(
        new THREE.SphereGeometry(sunRadiusEarth * SIZE_SCALE * sunDisplayScale, 64, 64),
        new THREE.MeshStandardMaterial({ emissive: 0xffb347, emissiveIntensity: 1.35, color: 0x5e3200 })
      );
      scene.add(sun);

      // Solar corona shell for cinematic glow.
      const coronaMat = new THREE.MeshBasicMaterial({
        color: 0xffc26e,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const sunCorona = new THREE.Mesh(
        new THREE.SphereGeometry(sunRadiusEarth * SIZE_SCALE * sunDisplayScale * 1.12, 48, 48),
        coronaMat
      );
      scene.add(sunCorona);

      let sizeBoost = 1.0;

      const TEX = {
        mercury: '/textures/mercury.jpg',
        venus: '/textures/venus.jpg',
        earth: '/textures/earth.jpg',
        mars: '/textures/mars.jpg',
        jupiter: '/textures/jupiter.jpg',
        saturn: '/textures/saturn.jpg',
        uranus: '/textures/uranus.jpg',
        neptune: '/textures/neptune.jpg'
      };
      const textureLoader = new THREE.TextureLoader();

      // Stricter-realism backdrop: static high-res star sphere (no artistic streaks/nebula drift).
      function makeCatalogLikeStarSky({ w = 8192, h = 4096, stars = 120000 }) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < stars; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;

          // Magnitude-like distribution: most stars faint/small.
          const r = Math.random();
          const size = r < 0.975 ? 1 : r < 0.997 ? 2 : 3;
          const alpha = r < 0.975 ? 0.25 + Math.random() * 0.35 : r < 0.997 ? 0.45 + Math.random() * 0.4 : 0.75 + Math.random() * 0.25;

          // Approximate stellar color mix (mostly white, some warm/cool).
          const warm = Math.random() < 0.1;
          const cool = !warm && Math.random() < 0.08;
          const color = warm ? '255,236,210' : cool ? '205,225,255' : '255,255,255';

          ctx.fillStyle = `rgba(${color},${alpha})`;
          ctx.fillRect(x, y, size, size);
        }

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
      }

      const skyTex = makeCatalogLikeStarSky({ stars: 120000 });
      const skyGeoA = new THREE.SphereGeometry(120000, 120, 120);
      const skyMatA = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, fog: false });
      const skyDomeA = new THREE.Mesh(skyGeoA, skyMatA);
      scene.add(skyDomeA);

      // Keep second dome handle for compatibility with animation/update paths.
      const skyDomeB = new THREE.Object3D();
      skyDomeB.visible = false;
      scene.add(skyDomeB);

      const planetData = [
        { name: 'Mercury', radiusEarth: 0.383, au: 0.39, periodYears: 0.24, dayHours: 1407.6, axialTiltDeg: 0.03, eccentricity: 0.2056, inclinationDeg: 7.00, nodeDeg: 48.33, color: 0x8c8c8c, texture: TEX.mercury },
        { name: 'Venus',   radiusEarth: 0.949, au: 0.72, periodYears: 0.62, dayHours: -5832.5, axialTiltDeg: 177.36, eccentricity: 0.0068, inclinationDeg: 3.39, nodeDeg: 76.68, color: 0xc7a46d, texture: TEX.venus },
        { name: 'Earth',   radiusEarth: 1.000, au: 1.00, periodYears: 1.00, dayHours: 23.93, axialTiltDeg: 23.44, eccentricity: 0.0167, inclinationDeg: 0.00, nodeDeg: -11.26, color: 0x4b78ff, texture: TEX.earth },
        { name: 'Mars',    radiusEarth: 0.532, au: 1.52, periodYears: 1.88, dayHours: 24.62, axialTiltDeg: 25.19, eccentricity: 0.0934, inclinationDeg: 1.85, nodeDeg: 49.58, color: 0xc86b4f, texture: TEX.mars },
        { name: 'Ceres',   radiusEarth: 0.074, au: 2.77, periodYears: 4.60, dayHours: 9.07, axialTiltDeg: 4.0, eccentricity: 0.0758, inclinationDeg: 10.59, nodeDeg: 80.30, color: 0x9a9a9a },
        { name: 'Jupiter', radiusEarth: 11.21, au: 5.20, periodYears: 11.86, dayHours: 9.93, axialTiltDeg: 3.13, eccentricity: 0.0489, inclinationDeg: 1.30, nodeDeg: 100.46, color: 0xd7b38c, texture: TEX.jupiter },
        { name: 'Saturn',  radiusEarth: 9.45,  au: 9.58, periodYears: 29.46, dayHours: 10.7, axialTiltDeg: 26.73, eccentricity: 0.0565, inclinationDeg: 2.49, nodeDeg: 113.67, color: 0xd8c28f, texture: TEX.saturn },
        { name: 'Uranus',  radiusEarth: 4.01,  au: 19.2, periodYears: 84.01, dayHours: -17.24, axialTiltDeg: 97.77, eccentricity: 0.0463, inclinationDeg: 0.77, nodeDeg: 74.02, color: 0x88d3dd, texture: TEX.uranus },
        { name: 'Neptune', radiusEarth: 3.88,  au: 30.05, periodYears: 164.8, dayHours: 16.11, axialTiltDeg: 28.32, eccentricity: 0.0095, inclinationDeg: 1.77, nodeDeg: 131.78, color: 0x4a7df6, texture: TEX.neptune },
        { name: 'Pluto',   radiusEarth: 0.186, au: 39.48, periodYears: 248.0, dayHours: -153.3, axialTiltDeg: 122.53, eccentricity: 0.2488, inclinationDeg: 17.16, nodeDeg: 110.30, color: 0xbcae9d },
        { name: 'Haumea',  radiusEarth: 0.128, au: 43.13, periodYears: 283.3, dayHours: 3.92, axialTiltDeg: 126.0, eccentricity: 0.1913, inclinationDeg: 28.19, nodeDeg: 121.78, color: 0xb8c7d8 },
        { name: 'Makemake',radiusEarth: 0.112, au: 45.79, periodYears: 309.9, dayHours: 22.83, axialTiltDeg: 29.0, eccentricity: 0.1590, inclinationDeg: 28.96, nodeDeg: 79.62, color: 0xc8b5a0 },
        { name: 'Eris',    radiusEarth: 0.182, au: 67.67, periodYears: 557.0, dayHours: 25.9, axialTiltDeg: 78.0, eccentricity: 0.4407, inclinationDeg: 44.04, nodeDeg: 35.95, color: 0xd7d7d7 }
      ];

      const planets = [];

      function orbitPosition(semiMajor, eccentricity, theta, inclinationDeg = 0, nodeDeg = 0) {
        const e = Math.min(0.95, Math.max(0, eccentricity || 0));
        const b = semiMajor * Math.sqrt(1 - e * e);

        // Orbital-plane position (Sun at one focus).
        const v = new THREE.Vector3(semiMajor * (Math.cos(theta) - e), 0, b * Math.sin(theta));

        // Rotate orbital plane into 3D space: inclination + longitude of ascending node.
        const inc = THREE.MathUtils.degToRad(inclinationDeg || 0);
        const node = THREE.MathUtils.degToRad(nodeDeg || 0);
        v.applyAxisAngle(new THREE.Vector3(1, 0, 0), inc);
        v.applyAxisAngle(new THREE.Vector3(0, 1, 0), node);
        return v;
      }

      function createOrbitPath(semiMajor, eccentricity = 0, inclinationDeg = 0, nodeDeg = 0) {
        return new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints(
            Array.from({ length: 256 }, (_, i) => {
              const t = (i / 256) * Math.PI * 2;
              return orbitPosition(semiMajor, eccentricity, t, inclinationDeg, nodeDeg);
            })
          ),
          new THREE.LineBasicMaterial({ color: 0x31486f, transparent: true, opacity: 0.75 })
        );
      }

      function computeRadius(p) {
        return Math.max(0.45, p.radiusEarth * SIZE_SCALE * sizeBoost);
      }

      function addPlanet(p) {
        const group = new THREE.Group();
        scene.add(group);

        const radius = computeRadius(p);
        const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, metalness: 0.0 });
        if (p.name === 'Ceres') {
          mat.color.setHex(0xb8b1a1);
          mat.emissive.setHex(0x0f0f10);
          mat.emissiveIntensity = 0.18;
          mat.roughness = 0.98;
        }
        if (p.texture) {
          textureLoader.load(
            p.texture,
            (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
              mat.map = tex;
              mat.roughness = 0.95;
              mat.metalness = 0.0;
              mat.needsUpdate = true;
            },
            undefined,
            () => {
              // fallback to solid color if texture fetch fails
              mat.color.setHex(p.color);
              mat.needsUpdate = true;
            }
          );
        }

        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 64, 64),
          mat
        );
        mesh.rotation.order = 'ZYX';
        mesh.rotation.z = THREE.MathUtils.degToRad(p.axialTiltDeg || 0);

        const orbitRadius = scaledOrbit(p.au);
        const phase = Math.random() * Math.PI * 2;
        mesh.position.copy(orbitPosition(orbitRadius, p.eccentricity || 0, phase, p.inclinationDeg || 0, p.nodeDeg || 0));
        group.add(mesh);

        const orbitPath = createOrbitPath(orbitRadius, p.eccentricity || 0, p.inclinationDeg || 0, p.nodeDeg || 0);
        scene.add(orbitPath);

        // Relative orbital angular speed (faster for shorter periods)
        const orbitSpeed = 1 / p.periodYears;

        const hours = Math.max(0.001, Math.abs(p.dayHours || 24));
        const spinSign = (p.dayHours || 24) < 0 ? -1 : 1;
        const spinSpeed = spinSign * 0.0025 * (24 / hours);

        return { ...p, group, mesh, orbitPath, orbitRadius, orbitSpeed, radius, phase, spinSpeed };
      }

      for (const p of planetData) planets.push(addPlanet(p));

      // AAA "accurate" asteroid belt (distribution + Kirkwood-like gaps + inclinations).
      const ASTEROID_COUNT = 5200;
      const asteroidGeo = new THREE.IcosahedronGeometry(0.35, 0);
      const asteroidMat = new THREE.MeshStandardMaterial({ color: 0xb2ab9a, emissive: 0x151515, emissiveIntensity: 0.25, roughness: 0.95, metalness: 0.0 });
      const asteroidBelt = new THREE.InstancedMesh(asteroidGeo, asteroidMat, ASTEROID_COUNT);
      asteroidBelt.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      asteroidBelt.frustumCulled = false;
      scene.add(asteroidBelt);

      const asteroidParams = [];

      // Supplemental dust layer so the belt reads clearly at a glance.
      const beltDustCount = 14000;
      const beltDustPos = new Float32Array(beltDustCount * 3);
      const beltDustGeo = new THREE.BufferGeometry();
      const beltDustMat = new THREE.PointsMaterial({ color: 0xc8c1af, size: 0.55, transparent: true, opacity: 0.42, depthWrite: false });
      const beltDust = new THREE.Points(beltDustGeo, beltDustMat);
      beltDust.frustumCulled = false;
      scene.add(beltDust);
      const beltDustParams = [];

      function inKirkwoodGap(au) {
        return (Math.abs(au - 2.50) < 0.045) || (Math.abs(au - 2.82) < 0.05) || (Math.abs(au - 2.95) < 0.04);
      }
      function sampleAsteroidAU() {
        // Main belt 2.1–3.3 AU with broad density peaks.
        for (let tries = 0; tries < 20; tries++) {
          const r = Math.random();
          let au;
          if (r < 0.44) au = 2.15 + Math.random() * 0.55;        // inner belt
          else if (r < 0.83) au = 2.55 + Math.random() * 0.45;   // central belt
          else au = 2.95 + Math.random() * 0.35;                 // outer belt
          if (!inKirkwoodGap(au)) return au;
        }
        return 2.6 + Math.random() * 0.5;
      }

      for (let i = 0; i < ASTEROID_COUNT; i++) {
        const au = sampleAsteroidAU();
        const e = Math.random() * 0.18;
        const inc = Math.pow(Math.random(), 1.8) * 18.0; // mostly low inclinations
        const node = Math.random() * 360;
        const phase = Math.random() * Math.PI * 2;
        const periodYears = Math.sqrt(au * au * au);
        const spin = (Math.random() - 0.5) * 0.03;
        const size = 0.24 + Math.pow(Math.random(), 2.0) * 1.1; // boosted for visibility while keeping distribution
        asteroidParams.push({ au, e, inc, node, phase, periodYears, spin, size });
      }

      for (let i = 0; i < beltDustCount; i++) {
        const au = sampleAsteroidAU();
        const e = Math.random() * 0.16;
        const inc = Math.pow(Math.random(), 2.0) * 16.0;
        const node = Math.random() * 360;
        const phase = Math.random() * Math.PI * 2;
        const periodYears = Math.sqrt(au * au * au);
        beltDustParams.push({ au, e, inc, node, phase, periodYears });
        const p = orbitPosition(scaledOrbit(au), e, phase, inc, node);
        beltDustPos[i * 3 + 0] = p.x;
        beltDustPos[i * 3 + 1] = p.y;
        beltDustPos[i * 3 + 2] = p.z;
      }
      beltDustGeo.setAttribute('position', new THREE.BufferAttribute(beltDustPos, 3));

      const tempObj = new THREE.Object3D();
      function updateAsteroidBelt(simT) {
        for (let i = 0; i < ASTEROID_COUNT; i++) {
          const a = asteroidParams[i];

1 25544U 98067A   24068.51243056  .00016717  00000+0  30058-3 0  9997

      function parseTLEText(text) {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const out = [];
        for (let i = 0; i < lines.length - 2; i++) {
          if (lines[i + 1].startsWith('1 ') && lines[i + 2].startsWith('2 ')) {
            out.push({ TLE_LINE1: lines[i + 1], TLE_LINE2: lines[i + 2] });
            i += 2;
          }
        }
        return out;

      async function loadSatellites() {
        let list = [];
        try {
          const res = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json');
          if (res.ok) {
            const data = await res.json();
            list = data.filter(d => d?.TLE_LINE1 && d?.TLE_LINE2).slice(0, 4000);
          }
        } catch {}

        if (!list.length) {
          try {
            const res2 = await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle');
            if (res2.ok) {
              const txt = await res2.text();
              list = parseTLEText(txt).slice(0, 4000);
            }
          } catch {}
        }

        if (!list.length) list = parseTLEText(fallbackTLE);

        satelliteState.satrecs = list.map(d => sat.twoline2satrec(d.TLE_LINE1, d.TLE_LINE2)).filter(Boolean);
        satelliteState.positions = new Float32Array(satelliteState.satrecs.length * 3);
        satelliteGeo.setAttribute('position', new THREE.BufferAttribute(satelliteState.positions, 3));
        satelliteState.loaded = satelliteState.satrecs.length > 0;

      loadSatellites();

      function updateSatellites(nowMs) {
        if (!satelliteState.loaded || !satelliteState.positions) return;
        if (nowMs - satelliteState.lastUpdateMs < 250) return;
        satelliteState.lastUpdateMs = nowMs;

        const earth = planets.find((p) => p.name === 'Earth');
        if (!earth) return;
        const unitsPerKm = (earth.radius / EARTH_RADIUS_KM) * SAT_VISUAL_SCALE;
        const when = new Date(nowMs);

        for (let i = 0; i < satelliteState.satrecs.length; i++) {
          const pv = sat.propagate(satelliteState.satrecs[i], when);
          if (!pv?.position) continue;
          const eci = pv.position;

          let xKm = eci.x;
          let yKm = eci.y;
          let zKm = eci.z;
          const rKm = Math.sqrt(xKm * xKm + yKm * yKm + zKm * zKm);
          const altKm = rKm - EARTH_RADIUS_KM;
          if (!Number.isFinite(altKm) || altKm < SAT_MIN_KM || altKm > SAT_MAX_KM) {
            satelliteState.positions[i * 3 + 0] = 0;
            satelliteState.positions[i * 3 + 1] = 0;
            satelliteState.positions[i * 3 + 2] = 0;
            continue;
          }

          const clampedAlt = Math.min(SAT_MAX_KM, Math.max(SAT_MIN_KM, altKm));
          const targetR = EARTH_RADIUS_KM + clampedAlt;
          const s = targetR / rKm;
          xKm *= s; yKm *= s; zKm *= s;

          satelliteState.positions[i * 3 + 0] = xKm * unitsPerKm;
          satelliteState.positions[i * 3 + 1] = zKm * unitsPerKm;
          satelliteState.positions[i * 3 + 2] = yKm * unitsPerKm;
        }
        satelliteGeo.attributes.position.needsUpdate = true;
      }

      function makeSaturnRingTexture() {
        const c = document.createElement('canvas');
        c.width = 4096;
        c.height = 256;
        const ctx = c.getContext('2d');

        const g = ctx.createLinearGradient(0, 0, c.width, 0);
        g.addColorStop(0.00, 'rgba(205,185,140,0.00)');   // inner fade
        g.addColorStop(0.06, 'rgba(188,170,132,0.16)');
        g.addColorStop(0.15, 'rgba(235,219,182,0.78)');   // C/B ring transition
        g.addColorStop(0.29, 'rgba(188,168,129,0.42)');
        g.addColorStop(0.43, 'rgba(242,229,196,0.92)');   // bright B ring
        g.addColorStop(0.49, 'rgba(90,84,76,0.08)');      // Cassini-division-like dark band
        g.addColorStop(0.60, 'rgba(240,226,192,0.82)');   // A ring start
        g.addColorStop(0.74, 'rgba(176,158,122,0.40)');
        g.addColorStop(0.86, 'rgba(228,212,178,0.66)');
        g.addColorStop(1.00, 'rgba(205,185,140,0.00)');   // outer fade
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, c.width, c.height);

        // Fine ringlets / radial grain
        for (let i = 0; i < 2400; i++) {
          const x = Math.random() * c.width;
          const w = Math.random() < 0.9 ? 1 : 2;
          const a = 0.012 + Math.random() * 0.09;
          const warm = Math.random() < 0.55;
          ctx.fillStyle = warm ? `rgba(255,240,205,${a})` : `rgba(170,160,145,${a})`;
          ctx.fillRect(x, 0, w, c.height);
        }

        // Subtle azimuthal noise so ring isn't too flat
        for (let y = 0; y < c.height; y += 2) {
          const a = 0.01 + Math.random() * 0.02;
          ctx.fillStyle = `rgba(255,255,255,${a})`;
          ctx.fillRect(0, y, c.width, 1);
        }

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
      }

      const saturnRingTex = makeSaturnRingTexture();

      function addSaturnRings(sat) {
        if (!sat) return;

        const base = new THREE.Mesh(
          new THREE.RingGeometry(sat.radius * 1.30, sat.radius * 2.32, 384),
          new THREE.MeshStandardMaterial({ map: saturnRingTex, color: 0xe8d9b6, side: THREE.DoubleSide, transparent: true, opacity: 0.92, roughness: 0.92, metalness: 0.0, alphaTest: 0.06, depthWrite: true })
        );
        base.rotation.x = -Math.PI / 2.4;
        base.userData.isSaturnRing = true;
        sat.mesh.add(base);

        const brightB = new THREE.Mesh(
          new THREE.RingGeometry(sat.radius * 1.48, sat.radius * 1.90, 320),
          new THREE.MeshStandardMaterial({ color: 0xf1e4c6, side: THREE.DoubleSide, transparent: true, opacity: 0.18, roughness: 0.95, metalness: 0.0, depthWrite: true })
        );
        brightB.rotation.x = -Math.PI / 2.4;
        brightB.userData.isSaturnRing = true;
        sat.mesh.add(brightB);

        const cassini = new THREE.Mesh(
          new THREE.RingGeometry(sat.radius * 1.90, sat.radius * 1.98, 320),
          new THREE.MeshStandardMaterial({ color: 0x2a2825, side: THREE.DoubleSide, transparent: true, opacity: 0.62, roughness: 1.0, metalness: 0.0, depthWrite: true })
        );
        cassini.rotation.x = -Math.PI / 2.4;
        cassini.userData.isSaturnRing = true;
        sat.mesh.add(cassini);

        const backscatter = new THREE.Mesh(
          new THREE.RingGeometry(sat.radius * 1.30, sat.radius * 2.32, 384),
          new THREE.MeshStandardMaterial({ map: saturnRingTex, color: 0xc9b590, side: THREE.DoubleSide, transparent: true, opacity: 0.08, roughness: 1.0, metalness: 0.0, depthWrite: false })
        );
        backscatter.rotation.x = -Math.PI / 2.4;
        backscatter.rotation.z = 0.003;
        backscatter.userData.isSaturnRing = true;
        sat.mesh.add(backscatter);


      }

      // Saturn rings
      const saturn = planets.find(p => p.name === 'Saturn');
      addSaturnRings(saturn);

      // UI
      const speedInput = document.getElementById('speed');
      const speedVal = document.getElementById('speedVal');
      const sizeBoostInput = document.getElementById('sizeBoost');
      const sizeBoostVal = document.getElementById('sizeBoostVal');
      const sunScaleInput = document.getElementById('sunScale');
      const sunScaleVal = document.getElementById('sunScaleVal');
      const sunTrueScaleInput = document.getElementById('sunTrueScale');
      const orbitToggle = document.getElementById('orbits');
      const asteroidToggle = document.getElementById('asteroids');
      const moonsToggle = document.getElementById('moons');
      const secondaryMoonsToggle = document.getElementById('secondaryMoons');
      const satellitesToggle = document.getElementById('satellites');
      const qualitySelect = document.getElementById('quality');
      const unitsSelect = document.getElementById('units');
      const focusBtn = document.getElementById('focusBtn');
      const homeBtn = document.getElementById('homeBtn');
      const cinematicInput = document.getElementById('cinematic');

      let speedMul = 1;
      speedInput.addEventListener('input', (e) => {
        speedMul = Number(e.target.value);
        speedVal.textContent = `${speedMul.toFixed(2)}x`;
      });

      function rebuildPlanetVisuals() {
        for (const p of planets) {
          const newRadius = computeRadius(p);
          p.radius = newRadius;
          p.mesh.geometry.dispose();
          p.mesh.geometry = new THREE.SphereGeometry(newRadius, 64, 64);

          if (p.mesh.userData.hoverOutline) {
            p.mesh.userData.hoverOutline.geometry.dispose();
            p.mesh.userData.hoverOutline.geometry = new THREE.EdgesGeometry(p.mesh.geometry);
            p.mesh.userData.hoverOutline.visible = false;
          }

          if (p.name === 'Earth') {
            if (earthCloudMesh) {
              earthCloudMesh.geometry.dispose();
              earthCloudMesh.geometry = new THREE.SphereGeometry(newRadius * 1.02, 64, 64);
            }
            if (earthAtmoMesh) {
              earthAtmoMesh.geometry.dispose();
              earthAtmoMesh.geometry = new THREE.SphereGeometry(newRadius * 1.08, 64, 64);
            }
          }
        }

        computeOrbitLayout(planets);

        for (const p of planets) {
          p.mesh.position.copy(orbitPosition(p.orbitRadius, p.eccentricity || 0, p.phase || 0, p.inclinationDeg || 0, p.nodeDeg || 0));

          scene.remove(p.orbitPath);
          p.orbitPath.geometry.dispose();
          p.orbitPath.material.dispose();
          p.orbitPath = createOrbitPath(p.orbitRadius, p.eccentricity || 0, p.inclinationDeg || 0, p.nodeDeg || 0);
          p.orbitPath.visible = orbitToggle.checked;
          scene.add(p.orbitPath);
        }

        const sat = planets.find(p => p.name === 'Saturn');
        if (sat) {
          for (const ch of [...sat.mesh.children]) {
            if (ch.userData?.isSaturnRing || ch.geometry?.type === 'RingGeometry') sat.mesh.remove(ch);
          }
          addSaturnRings(sat);
        }

        for (const m of moons) {
          const newMoonRadius = Math.max(m.secondary ? 0.08 : 0.04, m.radiusEarth * SIZE_SCALE * sizeBoost * 1.6);
          m.radius = newMoonRadius;
          m.mesh.geometry.dispose();
          m.mesh.geometry = new THREE.SphereGeometry(newMoonRadius, 32, 32);
        }
      }

      sizeBoostInput.addEventListener('input', (e) => {
        sizeBoost = Number(e.target.value);
        sizeBoostVal.textContent = `${sizeBoost.toFixed(1)}x`;
        rebuildPlanetVisuals();
      });

      function rebuildSunGeometry() {
        sunScaleVal.textContent = `${sunDisplayScale.toFixed(2)}x`;
        sun.geometry.dispose();
        sun.geometry = new THREE.SphereGeometry(sunRadiusEarth * SIZE_SCALE * sunDisplayScale, 64, 64);
        sunCorona.geometry.dispose();
        sunCorona.geometry = new THREE.SphereGeometry(sunRadiusEarth * SIZE_SCALE * sunDisplayScale * 1.12, 48, 48);
        if (sun.userData.hoverOutline) {
          sun.userData.hoverOutline.geometry.dispose();
          sun.userData.hoverOutline.geometry = new THREE.EdgesGeometry(sun.geometry);
          sun.userData.hoverOutline.visible = false;
        }
      }

      sunScaleInput.addEventListener('input', (e) => {
        if (sunTrueScaleInput.checked) return;
        sunDisplayScale = Number(e.target.value);
        rebuildSunGeometry();
        rebuildPlanetVisuals();
      });

      sunTrueScaleInput.addEventListener('change', (e) => {
        if (e.target.checked) {
          sunDisplayScale = 1;
          sunScaleInput.value = '1';
          sunScaleInput.disabled = true;
        } else {
          sunScaleInput.disabled = false;
          sunDisplayScale = Number(sunScaleInput.value);
        }
        rebuildSunGeometry();
        rebuildPlanetVisuals();
      });

      orbitToggle.addEventListener('change', (e) => {
        const visible = e.target.checked;
        for (const p of planets) p.orbitPath.visible = visible;
      });
      asteroidToggle.addEventListener('change', (e) => {
        asteroidBelt.visible = e.target.checked;
        beltDust.visible = e.target.checked;
      });
      moonsToggle.addEventListener('change', (e) => {
        for (const m of moons) m.mesh.visible = e.target.checked && (!m.secondary || secondaryMoonsToggle.checked);
        if (!e.target.checked) {
          for (const el of moonLabelEls.values()) el.style.display = 'none';
        }
      });
      secondaryMoonsToggle.addEventListener('change', (e) => {
        for (const m of moons) {
          if (m.secondary) m.mesh.visible = moonsToggle.checked && e.target.checked;
        }
      });
      satellitesToggle.addEventListener('change', (e) => {
        satellitePoints.visible = e.target.checked;
      });

      function setCinematicMode(enabled) {
        if (enabled) {
          document.getElementById('hud').style.opacity = '0.18';
          document.getElementById('hud').style.transition = 'opacity 220ms ease';
          bloomPass.strength = 0.9;
          bloomPass.radius = 0.9;
          bloomPass.threshold = 0.1;
          filmPass.uniforms['nIntensity'].value = 0.2;
          renderer.toneMappingExposure = 1.16;
          controls.enableDamping = true;
          controls.dampingFactor = 0.1;
        } else {
          document.getElementById('hud').style.opacity = '1';
          bloomPass.strength = 0.62;
          bloomPass.radius = 0.85;
          bloomPass.threshold = 0.14;
          filmPass.uniforms['nIntensity'].value = 0.12;
          renderer.toneMappingExposure = 1.08;
          controls.enableDamping = true;
          controls.dampingFactor = 0.05;
        }
      }

      cinematicInput.addEventListener('change', (e) => setCinematicMode(e.target.checked));

      qualitySelect.addEventListener('change', (e) => applyQualityPreset(e.target.value));
      unitsSelect.addEventListener('change', () => updateDetails());
      focusBtn.addEventListener('click', () => {
        if (selectedPlanet) focusOnPlanet(selectedPlanet);
      });
      homeBtn.addEventListener('click', () => {
        selectedPlanet = null;
        popupEl.style.display = 'none';
        setHover(null);
        updateDetails();
        goHome();
      });

      // initialize true-scale defaults
      sunScaleInput.disabled = sunTrueScaleInput.checked;
      if (sunTrueScaleInput.checked) {
        sunDisplayScale = 1;
        sunScaleInput.value = '1';
        sunScaleVal.textContent = '1.00x';
      }

      applyQualityPreset('auto');
      rebuildSunGeometry();
      rebuildPlanetVisuals();
      updateDetails();

      const clock = new THREE.Clock();
      function animate() {
        const t = clock.getElapsedTime() * speedMul * 0.25;
        updateAsteroidBelt(t);
        updateSatellites(Date.now());

        sun.rotation.y += 0.0018;
        sunCorona.rotation.y -= 0.0008;
        const coronaPulse = 1 + Math.sin(clock.getElapsedTime() * 1.25) * 0.015;
        sunCorona.scale.setScalar(coronaPulse);

        if (earthCloudMesh) earthCloudMesh.rotation.y += 0.0012;

        if (cinematicInput.checked && !focusLocked && !focusTargetPlanet) {
          const drift = clock.getElapsedTime();
          camera.position.x += Math.sin(drift * 0.11) * 0.015;
          camera.position.y += Math.cos(drift * 0.09) * 0.01;
        }

        // Keep backdrop centered on camera (static sky for stricter realism).
        skyDomeA.position.copy(camera.position);
        skyDomeB.position.copy(camera.position);

        for (const p of planets) {
          const theta = t * p.orbitSpeed + (p.phase || 0);
          p.mesh.position.copy(orbitPosition(p.orbitRadius, p.eccentricity || 0, theta, p.inclinationDeg || 0, p.nodeDeg || 0));
          p.mesh.rotateY(p.spinSpeed || 0.0025);

          const worldPos = new THREE.Vector3();
          p.mesh.getWorldPosition(worldPos);

          // Place label above planet in world space (Y-up axis), then project to screen.
          const labelWorldPos = worldPos.clone().add(new THREE.Vector3(0, Math.max(1.2, p.radius * 1.6), 0));
          const projected = labelWorldPos.clone().project(camera);
          const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
          const visible = projected.z < 1;

          const lbl = labelEls.get(p.name);
          if (lbl) {
            lbl.style.display = visible ? 'block' : 'none';
            lbl.style.left = `${x}px`;
            lbl.style.top = `${y}px`;
          }

          if (selectedPlanet && selectedPlanet.name === p.name) {
            popupEl.style.display = visible ? 'block' : 'none';
            popupEl.style.left = `${x}px`;
            popupEl.style.top = `${y - 26}px`;
          }
        }

        const focusedName = focusTargetPlanet?.name || null;
        for (const m of moons) {
          const hostPos = new THREE.Vector3();
          m.host.mesh.getWorldPosition(hostPos);
          const theta = t * m.orbitSpeed * 0.12 + m.phase;
          // Better model scaling: preserve real moon/host ratio, then compress moon systems globally.
          const hostRadiusKm = Math.max(1, (m.host.radiusEarth || 1) * EARTH_RADIUS_KM);
          const orbitInHostRadii = (m.orbitKm || 0) / hostRadiusKm;
          const physicallyScaled = m.host.radius * orbitInHostRadii * MOON_SYSTEM_COMPRESSION;
          const minClearance = m.host.radius + (m.radius * 1.2);
          const localR = Math.max(physicallyScaled, minClearance);
          const off = orbitPosition(localR, 0.02, theta, m.inc || 0, 0);
          m.mesh.position.copy(hostPos).add(off);
          m.mesh.rotation.y += 0.01;

          const lbl = moonLabelEls.get(m.name);
          if (!lbl) continue;
          const shouldShow = moonsToggle.checked && (!m.secondary || secondaryMoonsToggle.checked) && focusedName && (m.host.name === focusedName || m.name === focusedName);
          if (!shouldShow) {
            lbl.style.display = 'none';
            continue;
          }

          const lp = m.mesh.position.clone().add(new THREE.Vector3(0, Math.max(0.5, m.radius * 2.2), 0)).project(camera);
          const lx = (lp.x * 0.5 + 0.5) * window.innerWidth;
          const ly = (-lp.y * 0.5 + 0.5) * window.innerHeight;
          const visible = lp.z < 1;
          lbl.style.display = visible ? 'block' : 'none';
          lbl.style.left = `${lx}px`;
          lbl.style.top = `${ly}px`;
        }

        if (focusTargetPlanet && (focusLocked || focusStrength > 0.0001)) {
          const wp = new THREE.Vector3();
          focusTargetPlanet.mesh.getWorldPosition(wp);

          if (focusLocked) {
            // Keep camera orbit centered on the selected moving planet.
            if (!lastFocusWorldPos) lastFocusWorldPos = wp.clone();
            const delta = wp.clone().sub(lastFocusWorldPos);
            camera.position.add(delta);
            controls.target.copy(wp);
            lastFocusWorldPos.copy(wp);

            // Prevent clipping into the planet while still allowing very close zoom.
            const minDist = Math.max(0.6, (focusTargetPlanet.radius || 2) * 1.02);
            const offset = camera.position.clone().sub(controls.target);
            const dist = offset.length();
            if (dist < minDist && dist > 0) {
              camera.position.copy(controls.target).add(offset.multiplyScalar(minDist / dist));
            }
          } else {
            const dir = camera.position.clone().sub(controls.target).normalize();
            const desiredDist = Math.max(8, (focusTargetPlanet.radius || 2) * 12);
            const desiredPos = wp.clone().add(dir.multiplyScalar(desiredDist));
            controls.target.lerp(wp, 0.08);
            camera.position.lerp(desiredPos, 0.08);
            focusStrength *= 0.92;
          }
        }

        if (keyState.size) {
          const forward = controls.target.clone().sub(camera.position).normalize();
          const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
          const step = Math.max(0.2, camera.position.distanceTo(controls.target) * 0.01);

          if (keyState.has('w')) {
            camera.position.add(forward.clone().multiplyScalar(step));
            controls.target.add(forward.clone().multiplyScalar(step));
          }
          if (keyState.has('s')) {
            camera.position.add(forward.clone().multiplyScalar(-step));
            controls.target.add(forward.clone().multiplyScalar(-step));
          }
          if (keyState.has('a')) {
            camera.position.add(right.clone().multiplyScalar(-step));
            controls.target.add(right.clone().multiplyScalar(-step));
          }
          if (keyState.has('d')) {
            camera.position.add(right.clone().multiplyScalar(step));
            controls.target.add(right.clone().multiplyScalar(step));
          }
        }

        controls.update();
        composer.render();
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
